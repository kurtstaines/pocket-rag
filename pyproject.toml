[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pocket-rag"
version = "0.1.0"
description = "Local hybrid retrieval in one SQLite file: Ollama embeddings, full-text search, rank fusion, and a recall/MRR evaluation harness. No dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kurtlon Earl Sta. Ines" }]
dependencies = []
keywords = ["rag", "retrieval", "embeddings", "hybrid-search", "sqlite", "ollama", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]

[project.urls]
Homepage = "https://github.com/kurtstaines/pocket-rag"
Issues = "https://github.com/kurtstaines/pocket-rag/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pocket-rag = "pocket_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
